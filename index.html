<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Météo Edge AI</title>
    <style>
        /* === VARIABLES DE COULEURS === */
        :root {
            --bg-gradient-1: #0f172a;
            --bg-gradient-2: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-temp: #ef4444;  /* Rouge */
            --accent-hum: #3b82f6;   /* Bleu */
            --accent-press: #10b981; /* Vert */
            --accent-ia: #a855f7;    /* Violet */
            --color-beau: #fbbf24;   /* Jaune Soleil */
            --color-pluie: #60a5fa;  /* Bleu Pluie */
            --color-orage: #f87171;  /* Rouge Orage */
        }

        /* === STYLE GLOBAL === */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* === EN-TÊTE === */
        h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .status-container {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 40px;
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background-color: var(--accent-press);
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* === GRILLE DES CARTES === */
        .dashboard { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            max-width: 1000px;
        }

        /* === DESIGN DES CARTES === */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            width: 160px; 
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Carte Verdict plus large et mise en avant */
        .card-verdict { 
            width: 280px; 
            border-top: 4px solid var(--accent-ia);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(168, 85, 247, 0.1) 100%);
        }

        h3 { 
            margin-top: 0; 
            color: var(--text-muted); 
            font-size: 0.9em; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .valeur { 
            font-size: 2.5em; 
            font-weight: 800; 
            margin: 15px 0; 
        }

        .verdict-text { 
            font-size: 2em; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .unite { 
            font-size: 0.35em; 
            color: var(--text-muted); 
            font-weight: normal; 
            vertical-align: middle;
        }

        /* === HISTORIQUE TALKBACK === */
        .talkback-container {
            margin-top: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        .talkback-container h3 {
            text-align: left;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tb-count {
            background: var(--accent-ia);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        #talkback-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Custom Scrollbar pour la liste */
        #talkback-list::-webkit-scrollbar { width: 6px; }
        #talkback-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        #talkback-list li {
            background: rgba(0,0,0,0.3);
            margin-bottom: 8px;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent-ia);
        }

        .tb-time {
            color: var(--text-muted);
            font-size: 0.85em;
            font-family: monospace;
        }

        .tb-cmd {
            font-weight: bold;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <h1>🧠 Dashboard Edge AI</h1>
    <div class="status-container">
        <div class="pulse"></div>
        <span>En direct du NPU • MAJ : <strong id="heure">--:--:--</strong></span>
    </div>

    <div class="dashboard">
        <div class="card" style="border-bottom: 3px solid var(--accent-temp)">
            <h3>🌡️ Temp</h3>
            <p class="valeur" style="color: var(--accent-temp)"><span id="temp">--</span><span class="unite"> °C</span></p>
        </div>
        
        <div class="card" style="border-bottom: 3px solid var(--accent-hum)">
            <h3>💧 Hum</h3>
            <p class="valeur" style="color: var(--accent-hum)"><span id="hum">--</span><span class="unite"> %</span></p>
        </div>

        <div class="card card-verdict">
            <h3>⚡ Verdict IA</h3>
            <p class="verdict-text" id="verdict">Analyse...</p>
            <p style="color: var(--text-muted); font-size: 0.9em; margin-bottom: 0;">
                Confiance : <strong id="prob" style="color: var(--text-main); font-size: 1.2em;">--</strong> %
            </p>
        </div>
        
        <div class="card" style="border-bottom: 3px solid var(--accent-press)">
            <h3>🌪️ Pression</h3>
            <p class="valeur" style="color: var(--accent-press)"><span id="press">--</span><span class="unite"> hPa</span></p>
        </div>
    </div>

    <div class="talkback-container">
        <h3>
            <span>📋 Historique TalkBack (Commandes en attente)</span>
            <span class="tb-count" id="tb-count">0</span>
        </h3>
        <ul id="talkback-list">
            <li style="color: var(--text-muted); justify-content: center; border-left: none;">Chargement de l'historique...</li>
        </ul>
    </div>

    <script>
        // === ⚠️ TES CLES THINGSPEAK (À VÉRIFIER) ⚠️ ===
        const channelID = 'TON_CHANNEL_ID';   
        const readAPIKey = 'TA_READ_API_KEY'; 

        // Tes identifiants TalkBack (Récupérés depuis ton code C)
        const talkbackID = '56801';
        const talkbackAPIKey = 'YOSMVPGKEFNLLX1W';
        // ==========================================

        const urlFeed = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`;
        const urlTalkback = `https://api.thingspeak.com/talkbacks/${talkbackID}/commands.json?api_key=${talkbackAPIKey}`;
        
        const meteoLabels = ["Beau Temps", "Pluvieux", "Orageux"];
        const meteoColors = ["var(--color-beau)", "var(--color-pluie)", "var(--color-orage)"];

        // 1. Récupération des données capteurs
        async function fetchMeteo() {
            try {
                const response = await fetch(urlFeed);
                const data = await response.json();
                
                if(data.feeds && data.feeds.length > 0) {
                    const dernierReleve = data.feeds[0];

                    document.getElementById('temp').innerText = dernierReleve.field1 ? dernierReleve.field1 : "--";
                    document.getElementById('hum').innerText = dernierReleve.field2 ? dernierReleve.field2 : "--";
                    document.getElementById('press').innerText = dernierReleve.field3 ? dernierReleve.field3 : "--";
                    
                    if(dernierReleve.field4) {
                        document.getElementById('prob').innerText = parseFloat(dernierReleve.field4).toFixed(1);
                    }

                    const indexIA = parseInt(dernierReleve.field5);
                    const verdictElement = document.getElementById('verdict');
                    
                    if(!isNaN(indexIA) && indexIA >= 0 && indexIA < meteoLabels.length) {
                        verdictElement.innerText = meteoLabels[indexIA];
                        verdictElement.style.color = meteoColors[indexIA];
                    }

                    document.getElementById('heure').innerText = new Date(dernierReleve.created_at).toLocaleTimeString();
                }
            } catch (error) {
                console.error("Erreur Capteurs :", error);
            }
        }

        // 2. Récupération de la file TalkBack
        async function fetchTalkBack() {
            try {
                const response = await fetch(urlTalkback);
                const commands = await response.json();
                
                const listElement = document.getElementById('talkback-list');
                const countElement = document.getElementById('tb-count');
                
                listElement.innerHTML = ''; // On vide la liste
                countElement.innerText = commands.length; // On met à jour le compteur

                if (commands.length === 0) {
                    listElement.innerHTML = '<li style="color: var(--text-muted); justify-content: center; border-left: none;">Aucune commande en attente.</li>';
                    return;
                }

                // On affiche la liste (les plus récentes en haut)
                // Inverser le tableau pour avoir le dernier POST en premier
                commands.reverse().forEach(cmd => {
                    const li = document.createElement('li');
                    const date = new Date(cmd.created_at).toLocaleTimeString();
                    
                    // On attribue la couleur correspondante à la commande si possible
                    let colorCode = "var(--text-main)";
                    if(cmd.command_string === "Beau_Temps") colorCode = "var(--color-beau)";
                    if(cmd.command_string === "Pluvieux") colorCode = "var(--color-pluie)";
                    if(cmd.command_string === "Orageux") colorCode = "var(--color-orage)";

                    li.innerHTML = `
                        <span class="tb-time">🕒 ${date}</span> 
                        <span class="tb-cmd" style="color: ${colorCode}">${cmd.command_string}</span>
                    `;
                    listElement.appendChild(li);
                });

            } catch (error) {
                console.error("Erreur TalkBack :", error);
            }
        }

        // Boucle principale
        function actualiserDashboard() {
            fetchMeteo();
            fetchTalkBack();
        }

        actualiserDashboard();
        setInterval(actualiserDashboard, 20000);
    </script>

</body>
</html>
