<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Station Météo IA (Edge AI)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #eef2f5; padding: 40px; color: #333; }
        .dashboard { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); width: 220px; border-top: 4px solid #007BFF; }
        .card-ia { border-top: 4px solid #8E44AD; /* Couleur violette pour différencier l'IA */ background-color: #fcf9ff;}
        .valeur { font-size: 2.5em; font-weight: bold; margin: 15px 0; color: #2C3E50; }
        .unite { font-size: 0.4em; color: #7f8c8d; }
        h3 { margin-top: 0; color: #34495e; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <h1>Tableau de Bord : Station Météo Edge AI</h1>
    <p>Dernière mise à jour : <strong id="heure">-</strong></p>

    <div class="dashboard">
        <div class="card">
            <h3>Température</h3>
            <p class="valeur"><span id="temp">--</span><span class="unite"> °C</span></p>
        </div>
        <div class="card">
            <h3>Humidité</h3>
            <p class="valeur"><span id="hum">--</span><span class="unite"> %</span></p>
        </div>
        <div class="card">
            <h3>Pression</h3>
            <p class="valeur"><span id="press">--</span><span class="unite"> hPa</span></p>
        </div>
        
        <div class="card card-ia">
            <h3>Confiance IA</h3>
            <p class="valeur"><span id="prob">--</span><span class="unite"> %</span></p>
        </div>
    </div>

    <script>
        const channelID = '3347394';   
        const readAPIKey = 'JDL5UC8GJGC5KB02'; 
        
        const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=1`;

        async function fetchMeteo() {
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.feeds && data.feeds.length > 0) {
                    const dernierReleve = data.feeds[0];

                    document.getElementById('temp').innerText = dernierReleve.field1 ? dernierReleve.field1 : "--";
                    document.getElementById('hum').innerText = dernierReleve.field2 ? dernierReleve.field2 : "--";
                    document.getElementById('press').innerText = dernierReleve.field3 ? dernierReleve.field3 : "--";
                    
                    if(dernierReleve.field4) {
                        document.getElementById('prob').innerText = parseFloat(dernierReleve.field4).toFixed(1);
                    } else {
                        document.getElementById('prob').innerText = "--";
                    }

                    document.getElementById('heure').innerText = new Date(dernierReleve.created_at).toLocaleTimeString();
                }
            } catch (error) {
                console.error("Erreur de connexion à ThingSpeak :", error);
            }
        }

        fetchMeteo();

        setInterval(fetchMeteo, 20000);
    </script>

</body>
</html>
